# ============================================================
# Arquivo de configuração do Spring Boot.
# É lido automaticamente quando a aplicação sobe.
# Linhas que começam com # são comentários e são ignoradas.
# ============================================================

# Nome da aplicação. Aparece nos logs; não altera o funcionamento.
spring.application.name=cadastro

# ------------------------------------------------------------
# CONEXÃO COM O BANCO DE DADOS (MySQL)
# ------------------------------------------------------------

# Endereço do banco, no formato: jdbc:<banco>://<máquina>:<porta>/<nome-do-banco>
#   jdbc            -> protocolo que o Java usa para falar com bancos
#   mysql           -> tipo do banco (exige o MySQL Driver no pom.xml)
#   localhost       -> o banco está na própria máquina
#   3306            -> porta padrão do MySQL
#   registro_pessoa -> banco criado no Workbench
spring.datasource.url=jdbc:mysql://localhost:3306/registro_pessoa

# Usuário que o Spring usa para entrar no MySQL.
spring.datasource.username={DB_USER}

# Senha desse usuário. Troque pela sua.
# Antes de subir para o GitHub, use uma variável de ambiente: ${DB_PASSWORD}
spring.datasource.password={DB_PASSWORD}

# ------------------------------------------------------------
# JPA / HIBERNATE
# ------------------------------------------------------------

# O que o Hibernate faz com as tabelas quando a aplicação sobe:
#   none        -> não mexe em nada
#   validate    -> só confere se as tabelas batem com as entidades
#   update      -> cria tabelas/colunas que faltam, sem apagar dados (usado para aprender)
#   create      -> apaga e recria as tabelas toda vez que sobe
#   create-drop -> igual ao create, e apaga tudo ao encerrar
spring.jpa.hibernate.ddl-auto=update

# Mostra no console cada SQL que o Hibernate executa.
# Ajuda a entender o que acontece por trás de cada chamada.
spring.jpa.show-sql=true